<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trends - Data Tracker</title>
<meta name="theme-color" content="#12263a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<main>
<h1>Trends</h1>
<p class="muted">Computed in your browser from data/history.csv. The numbers change as the history grows.</p>
<p id="msg" class="msg" hidden></p>
<section class="report">
  <h2>Each value over the days</h2>
  <div class="controls">
    <label>Value<select id="value"></select></label>
    <div class="row-buttons"><button id="all">Show all</button><button id="none">Show none</button></div>
  </div>
  <div class="items" id="itemlist"></div>
  <div id="lines"></div>
</section>
<div id="sections"><p class="muted">Loading...</p></div>
</main>
<script src="app.js"></script>
<script src="charts.js"></script>
<script src="trends.js"></script>
</body>
</html>
