<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse - Data Tracker</title>
<meta name="theme-color" content="#12263a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<main>
<h1>Browse</h1>
<p id="msg" class="msg" hidden></p>
<div class="controls">
  <label>Region<select id="region"><option value="">All regions</option></select></label>
  <label>Country<select id="country"><option value="">All countries</option></select></label>
  <label>Search item names<input id="q" type="search" placeholder="e.g. tokyo"></label>
  <label>Shortlist<span><input id="short" type="checkbox"> Only starred (<span id="shortcount">0</span>)</span></label>
</div>
<p class="muted" id="count"></p>
<p class="muted">Click a column heading to sort. Click it again to reverse the order.</p>
<div class="wrap"><table><thead><tr id="headrow"></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="app.js"></script>
<script src="browse.js"></script>
</body>
</html>
